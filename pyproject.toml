[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
ignore = [
    "E501",   # line-too-long (Chinese prompts exceed 120 chars)
    "UP042",  # replace-str-enum (requires unsafe fix, defer to future refactor)
    "B008",   # function-call-in-default-argument (FastAPI Depends pattern)
    "B904",   # raise-without-from-inside-except (渐进式: 后续逐步修复)
    "E402",   # module-import-not-at-top-of-file (lazy imports for circular deps)
    "SIM102", # collapsible-if (style preference)
    "SIM105", # suppressible-exception (style preference)
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
    "SIM110", # reimplemented-builtin (style preference)
    "SIM116", # if-else-block-instead-of-dict-lookup (readability preference)
    "B905",   # zip-without-explicit-strict (渐进式: 后续修复)
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-m \"not integration\""
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires database/external services)",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/db/*", "src/stores/supabase/*"]

[tool.coverage.report]
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
