name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Prettier check
        run: cd frontend && npm run format:check

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/

      - name: Ruff format check
        run: ruff format --check src/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - name: Run Vitest
        run: cd frontend && npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v
        env:
          LLM_API_KEY: test-key-for-ci
          LLM_API_BASE: https://api.deepseek.com

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: htmlcov/

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - run: cd frontend && npm run build

  docker-build:
    name: Docker Build + Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, lint-backend, type-check, test-frontend, test-backend, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: gc-teamwork-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: gc-teamwork-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose smoke test
        run: |
          # Create a minimal .env so compose can start without real secrets
          cat > .env <<'ENVEOF'
          DEBUG=false
          LLM_API_KEY=ci-dummy-key
          LLM_API_BASE=https://api.deepseek.com
          LLM_MODEL=deepseek-chat
          USE_SUPABASE=false
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          SUPABASE_SERVICE_ROLE_KEY=
          DATABASE_URL=
          VECTOR_DB_BACKEND=memory
          EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
          EMBEDDING_DIMENSION=512
          ENVEOF

          # Patch compose to use locally built CI images (not build: directives)
          sed 's|build:|#build:|g; s|context:|#context:|g; s|dockerfile:|#dockerfile:|g' docker-compose.yml > docker-compose.ci.yml
          sed -i 's|image: gc-teamwork-backend:latest|image: gc-teamwork-backend:ci|g' docker-compose.ci.yml
          sed -i 's|image: gc-teamwork-frontend:latest|image: gc-teamwork-frontend:ci|g' docker-compose.ci.yml

          docker compose -f docker-compose.ci.yml up -d
          sleep 20

          # Health check backend
          curl -fsS http://localhost:8000/health || \
            (docker compose -f docker-compose.ci.yml logs backend && exit 1)

          # Reachability check frontend
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:80/)
          echo "Frontend HTTP status: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || \
            (docker compose -f docker-compose.ci.yml logs frontend && exit 1)

          docker compose -f docker-compose.ci.yml down
